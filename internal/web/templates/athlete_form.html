{{define "title"}}{{.Heading}} · Organizer{{end}}
{{define "content"}}
<h1>{{.Heading}}</h1>
{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
<form method="post" action="{{.Action}}" hx-post="{{.Action}}" hx-target="body" class="stack">
  <label>
    {{t "athlete.firstName"}}
    <input name="firstName" value="{{.Athlete.FirstName}}" autocomplete="off" autofocus required />
  </label>
  <label>
    {{t "athlete.lastName"}}
    <input name="lastName" value="{{.Athlete.LastName}}" autocomplete="off" required />
  </label>
  <label>
    {{t "athlete.birthDate"}}
    <input type="date" name="birthDate" value="{{.Athlete.BirthDate}}" />
  </label>
  <label>
    {{t "athlete.joinedOn"}}
    <input type="date" name="joinedOn" value="{{.Athlete.JoinedOn}}" />
  </label>
  <label>
    {{t "athlete.notes"}}
    <textarea name="notes" rows="4">{{.Athlete.Notes}}</textarea>
    <span class="hint">{{t "athlete.notesHint"}}</span>
  </label>
  <div class="form-actions">
    <button class="btn" type="submit">{{t "common.save"}}</button>
    <a class="btn secondary" href="{{.Cancel}}">{{t "common.cancel"}}</a>
  </div>
</form>
{{end}}
